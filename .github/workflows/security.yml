name: Security Scan

# Backstop gate for the public repo: fails the build on any secret, private
# path, internal host, or injected identity/customer term. Runs on every push
# and PR so nothing sensitive can land on the default branch unreviewed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # gitleaks lists the PR's commits through the API

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan commits, not just HEAD

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Free for public repositories; no license key required.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # The same gitleaks the release scan runs; the action default (8.24.3) ignores .gitleaks.toml [[allowlists]].
          GITLEAKS_VERSION: "8.28.0"
          # Required since gitleaks-action v2 to scan pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A leak fails the job and shows in its log; PR comments would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: "false"

  sensitive-content:
    name: Sensitive-content scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Scan for private paths, hosts, and identity/customer terms
        run: bun .github/scripts/leak-scan.ts
        env:
          # Pipe-delimited identity/customer terms — names, private hostnames,
          # addresses, personal emails. Lives ONLY as a repo secret so the
          # public workflow never carries the strings it protects.
          # Set with: gh secret set SENSITIVE_TERMS (run inside a checkout of this repo)
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
